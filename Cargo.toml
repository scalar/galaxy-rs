[package]
name = "scalar-galaxy"
version = "0.2.1" # x-release-please-version
edition = "2024"
rust-version = "1.85"
description = "The Scalar Galaxy is an example OpenAPI document to test OpenAPI tools and libraries. It's a fictional universe with fictional planets and fictional data."
authors = ["Scalar Galaxy"]
license = "Apache-2.0"
keywords = ["api", "sdk", "client"]
categories = ["api-bindings"]

[dependencies]
http = "1"
http-body = "1"
bytes = "1"
getrandom = { version = "0.3", optional = true }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
serde = { version = "1.0.181", features = ["derive"] }
serde_json = "1"
thiserror = "2"
url = "2"
reqwest = { version = "0.13", optional = true, default-features = false, features = ["stream"] }
tokio = { version = "1", optional = true, features = ["time"] }
tracing = { version = "0.1", optional = true, default-features = false, features = ["std"] }
chrono = { version = "0.4", features = ["serde"] }
hmac = "0.13"
sha2 = "0.11"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["client-legacy", "http1", "tokio"] }
http-body-util = "0.1"

[features]
default = ["reqwest", "rustls", "multipart"]
reqwest = ["dep:reqwest", "tokio"]
tokio = ["dep:tokio"]
rustls = ["reqwest?/rustls"]
native-tls = ["reqwest?/native-tls"]
mock = []
tracing = ["dep:tracing"]
multipart = ["dep:getrandom"]

[[test]]
name = "mock"
required-features = ["mock", "tokio"]

[[example]]
name = "byo_transport_hyper"
required-features = ["tokio"]

[[example]]
name = "mock_transport"
required-features = ["mock", "tokio"]

[lints.rust]
# No rustc lint is relaxed: every one keeps its default level.

[lints.clippy]
# Generated response and webhook enums wrap payload models of genuinely
# different sizes; boxing every large variant would cost an indirection and
# the ergonomics of matching on the common path.
large_enum_variant = "allow"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
